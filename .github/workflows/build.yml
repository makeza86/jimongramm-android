name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore keystore.jks -alias jimongramm -keyalg RSA -keysize 2048 -validity 10000 -storepass jimongramm123 -keypass jimongramm123 -dname "CN=JimonGramm, OU=Mobile, O=JimonGroup, L=Almaty, S=Almaty, C=KZ"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks keystore.jks --ks-key-alias jimongramm --ks-pass pass:jimongramm123 --key-pass pass:jimongramm123 --out app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JimonGramm-APK
          path: app-release-signed.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JimonGramm v1.0.${{ github.run_number }}
          files: app-release-signed.apk
          generate_release_notes: false
          body: |
            📱 JimonGramm Android App
            
            **Установка:**
            1. Скачайте APK файл
            2. На телефоне: Настройки → Безопасность → Разрешить установку из неизвестных источников
            3. Откройте скачанный файл и установите
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
