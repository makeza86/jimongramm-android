name: Build AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create ADI token
        run: |
          mkdir -p app/src/main/assets
          echo "com.android.vending.derived.apk.id=CVWTEUMTCNMBQAAAAAAAAAAAA" > app/src/main/assets/adi-registration.properties

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore keystore.jks -alias jimongramm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jimongramm123 -keypass jimongramm123 \
            -dname "CN=JimonGramm, OU=Mobile, O=JimonGroup, L=Almaty, S=Almaty, C=KZ"

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign AAB
        run: |
          jarsigner -verbose \
            -keystore keystore.jks \
            -storepass jimongramm123 \
            -keypass jimongramm123 \
            -signedjar app-release-signed.aab \
            app/build/outputs/bundle/release/app-release.aab \
            jimongramm

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias jimongramm \
            --ks-pass pass:jimongramm123 \
            --key-pass pass:jimongramm123 \
            --out app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: JimonGramm-AAB
          path: app-release-signed.aab
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JimonGramm v1.0.${{ github.run_number }}
          files: |
            app-release-signed.aab
            app-release-signed.apk
          generate_release_notes: false
          body: |
            📱 JimonGramm AAB для Google Play
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
