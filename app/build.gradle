plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.jimongramm.app'

    defaultConfig {
        applicationId "com.jimongramm.app"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword "jimongramm123"
            keyAlias "jimongramm"
            keyPassword "jimongramm123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
